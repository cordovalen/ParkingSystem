services:
  mongo:
    image: mongo:7
    container_name: parking-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
    volumes:
      - mongo_data:/data/db
      - ./scripts/mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "${MONGO_INITDB_ROOT_USERNAME}", "-p", "${MONGO_INITDB_ROOT_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - parking-net

  vision-service:
    build:
      context: ./vision-service
      dockerfile: Dockerfile
    container_name: parking-vision
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${VISION_SERVICE_PORT:-8000}:8000"
    volumes:
      - ./assets/sample-plates:/app/samples:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - parking-net

volumes:
  mongo_data:
    name: parking_mongo_data

networks:
  parking-net:
    name: parking-net
    driver: bridge